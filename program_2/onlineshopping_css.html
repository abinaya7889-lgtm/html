<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial;
            margin: 0;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
        }

        .product {
            background-color: white;
            width: 200px;
            padding: 20px;
            text-align: center;
            border: 1px solid gray;
            border-radius: 10px;
        }

        .product h3 {
            color: navy;
        }

        .product p {
            color: green;
            font-size: 18px;
        }

        button {
            background-color: orange;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Online Shopping</h1>
        <p>Best Products at Best Prices</p>
    </header>

    <div class="products">
        <div class="product">
            <h3>Laptop</h3>
            <p>Rs. 45000</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h3>Mobile</h3>
            <p>Rs. 15000</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h3>Headphones</h3>
            <p>Rs. 2000</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>
</html>
